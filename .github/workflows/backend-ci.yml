name: Backend CI

on:
  push:
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fonely_test
          POSTGRES_USER: fonely_test
          POSTGRES_PASSWORD: fonely_test_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fonely_test -d fonely_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      FONELY_TEST_DATABASE_URL: postgresql+asyncpg://fonely_test:fonely_test_ci_only@localhost:5432/fonely_test
      DATABASE_URL: postgresql+asyncpg://fonely_test:fonely_test_ci_only@localhost:5432/fonely_test
      FONELY_ALLOW_DESTRUCTIVE_TEST_DB: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      # actions/checkout v4.2.2
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python v5.3.0
      - name: Install Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"

      # astral-sh/setup-uv v4.2.0
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a

      # actions/cache v4.2.4
      - name: Cache uv packages
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml', 'backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.12-

      - name: Require lockfile
        run: |
          if [ ! -f uv.lock ]; then
            echo "ERROR: backend/uv.lock not found. Run 'uv lock' locally and commit the lockfile."
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Validate evaluation corpus and tool contracts
        working-directory: .
        run: >-
          backend/.venv/bin/python scripts/validate-evals.py
          --tool-mismatch-report "${{ runner.temp }}/tool-contract-mismatches.ci.json"

      - name: Verify Chennai pilot evaluation coverage
        working-directory: .
        run: >-
          backend/.venv/bin/python scripts/report-eval-coverage.py
          --profile chennai-pilot

      - name: Verify package import
        run: .venv/bin/python -c "import fonely; print(fonely.__file__)"

      - name: Ruff check
        run: .venv/bin/ruff check .

      - name: Ruff format check
        run: .venv/bin/ruff format --check .

      - name: Mypy
        run: .venv/bin/mypy src

      - name: Migration upgrade to head
        run: .venv/bin/alembic upgrade head

      - name: Alembic check
        run: .venv/bin/alembic check

      - name: Readiness verifier unit tests
        working-directory: .
        run: backend/.venv/bin/python -m pytest scripts/tests/test_check_deployment_readiness.py -q

      - name: Database deployment readiness check
        working-directory: .
        env:
          FONELY_READINESS_DATABASE_URL: ${{ env.FONELY_TEST_DATABASE_URL }}
          FONELY_READINESS_ENVIRONMENT: github-ci
        run: |
          set -euo pipefail
          backend/.venv/bin/python scripts/check-deployment-readiness.py | tee /dev/stderr | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['overall_status']=='passed', 'readiness check failed'"

      - name: Verify execution-verifier unit tests
        working-directory: .
        run: backend/.venv/bin/python -m pytest scripts/tests/test_verify_ci_execution.py -q

      - name: Initialize execution evidence state
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("${{ runner.temp }}/test-terminal-state.json").write_text(
              json.dumps({"terminal_state": "verifier_not_run"}, indent=2) + "\n"
          )
          PY

      - name: Collect exact test partitions
        working-directory: .
        run: |
          set -euo pipefail
          cd backend
          .venv/bin/pytest --collect-only -q > "${{ runner.temp }}/all-tests.txt"
          .venv/bin/pytest --collect-only -q -m "not postgres" > "${{ runner.temp }}/non-pg-tests.txt"
          .venv/bin/pytest --collect-only -q -m postgres > "${{ runner.temp }}/pg-tests.txt"
          cd ..
          backend/.venv/bin/python scripts/verify-test-partitions.py \
            --all "${{ runner.temp }}/all-tests.txt" \
            --non-pg "${{ runner.temp }}/non-pg-tests.txt" \
            --pg "${{ runner.temp }}/pg-tests.txt" \
            --report "${{ runner.temp }}/test-partitions.json"

      - name: Execute and verify all test partitions
        working-directory: .
        env:
          FONELY_REQUIRE_POSTGRES_EXECUTION: "1"
        run: |
          set +e
          cd backend
          .venv/bin/pytest -m "not postgres" -q \
            --junitxml "${{ runner.temp }}/non-pg-junit.xml"
          NON_PG_STATUS=$?
          .venv/bin/pytest -m postgres -q \
            --junitxml "${{ runner.temp }}/pg-junit.xml"
          PG_STATUS=$?
          cd ..
          backend/.venv/bin/python scripts/verify-test-execution.py \
            --inventory "${{ runner.temp }}/test-partitions.json" \
            --non-pg-junit "${{ runner.temp }}/non-pg-junit.xml" \
            --pg-junit "${{ runner.temp }}/pg-junit.xml" \
            --skip-allowlist qa/allowed-skips.json \
            --environment ci \
            --report "${{ runner.temp }}/test-execution.json"
          VERIFIER_STATUS=$?
          python3 - <<PY
          import json
          from pathlib import Path
          states = {
              "non_pg_pytest_exit": int("$NON_PG_STATUS"),
              "pg_pytest_exit": int("$PG_STATUS"),
              "verifier_exit": int("$VERIFIER_STATUS"),
          }
          if states["non_pg_pytest_exit"] or states["pg_pytest_exit"]:
              terminal = "pytest_failed"
          elif states["verifier_exit"]:
              terminal = "verifier_failed"
          else:
              terminal = "success"
          states["terminal_state"] = terminal
          Path("${{ runner.temp }}/test-terminal-state.json").write_text(
              json.dumps(states, indent=2) + "\\n"
          )
          PY
          if [ "$NON_PG_STATUS" -ne 0 ] || [ "$PG_STATUS" -ne 0 ] || [ "$VERIFIER_STATUS" -ne 0 ]; then
            exit 1
          fi

      - name: Upload exact-SHA test evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760af5291623115de2585dae65720b
        with:
          name: test-execution-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/all-tests.txt
            ${{ runner.temp }}/non-pg-tests.txt
            ${{ runner.temp }}/pg-tests.txt
            ${{ runner.temp }}/test-partitions.json
            ${{ runner.temp }}/non-pg-junit.xml
            ${{ runner.temp }}/pg-junit.xml
            ${{ runner.temp }}/test-execution.json
            ${{ runner.temp }}/test-terminal-state.json
          if-no-files-found: error
          retention-days: 30

      - name: Migration downgrade to base
        run: .venv/bin/alembic downgrade base

      - name: Migration upgrade to head (verify re-upgrade)
        run: .venv/bin/alembic upgrade head

      - name: Backup-restore verification unit tests
        working-directory: .
        run: backend/.venv/bin/python -m pytest scripts/tests/test_verify_backup_restore.py -q

      - name: Backup-restore verification (live)
        working-directory: .
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: fonely_test
          PGPASSWORD: fonely_test_ci_only
          FONELY_BACKUP_SOURCE_URL: postgresql://fonely_test:fonely_test_ci_only@localhost:5432/fonely_test
          FONELY_BACKUP_RESTORE_URL: postgresql://fonely_test:fonely_test_ci_only@localhost:5432/fonely_test_restore
          FONELY_BACKUP_ENVIRONMENT: github-ci
        run: |
          set -euo pipefail
          trap 'dropdb --if-exists fonely_test_restore 2>/dev/null || true' EXIT

          psql -d fonely_test -c "
            INSERT INTO businesses (id, name, category, primary_contact_phone, timezone, subscription)
            VALUES (1, 'Test Salon A', 'salon', '+919000000001', 'Asia/Kolkata', 'trial'),
                   (2, 'Test Salon B', 'salon', '+919000000002', 'Asia/Kolkata', 'trial')
            ON CONFLICT DO NOTHING;
            INSERT INTO business_users (business_id, phone, role, is_active)
            VALUES (1, '+919000000001', 'owner', true),
                   (2, '+919000000002', 'owner', true)
            ON CONFLICT DO NOTHING;
            INSERT INTO services (id, business_id, name, duration_minutes, buffer_before_minutes, buffer_after_minutes, price, is_active)
            VALUES (1, 1, 'Haircut', 30, 0, 0, 500.00, true),
                   (2, 2, 'Facial', 45, 5, 5, 800.00, true)
            ON CONFLICT DO NOTHING;
            INSERT INTO resources (id, business_id, name, resource_type, is_active)
            VALUES (1, 1, 'Priya', 'staff', true),
                   (2, 2, 'Mira', 'staff', true)
            ON CONFLICT DO NOTHING;
          "

          createdb fonely_test_restore

          backend/.venv/bin/python scripts/verify-backup-restore.py | tee /dev/stderr | \
          python3 -c "import json,sys; d=json.load(sys.stdin); assert d['overall_status']=='passed', 'backup-restore failed'"
