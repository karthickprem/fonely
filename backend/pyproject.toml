[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fonely"]

[project]
name = "fonely"
version = "0.1.0"
description = "AI business assistant for Indian MSMEs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14.0",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "aiosqlite>=0.21",
    "alembic>=1.15",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "mypy>=1.15",
    "coverage>=7.0",
    "factory-boy>=3.3",
    "jsonschema>=4.26,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: requires FONELY_TEST_DATABASE_URL and PostgreSQL",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
