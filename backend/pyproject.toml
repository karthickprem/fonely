[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fonely"]

[project]
name = "fonely"
version = "0.1.0"
description = "AI business assistant for Indian MSMEs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14.0",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "aiosqlite>=0.21",
    "alembic>=1.15",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    # Voice runtime: the streaming pipeline (FrameProcessors, LLM context
    # aggregator) and its Anthropic/Cartesia/Sarvam service adapters live in
    # fonely.voice and import these at module load. Without them declared, the
    # locked environment cannot import fonely.voice and the voice suite fails
    # collection. The service extras pull the provider SDKs pipecat wraps.
    "pipecat-ai[anthropic,cartesia,sarvam]>=1.7,<2",
    # fonely.voice imports the anthropic SDK directly (not only through
    # pipecat), so declare it explicitly rather than relying on a transitive.
    "anthropic>=0.120,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "mypy>=1.15",
    "coverage>=7.0",
    "factory-boy>=3.3",
    "jsonschema>=4.26,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Config-level warning-as-error so a re-introduced async leak fails the suite
# rather than passing with exit 0. An un-awaited FrameProcessor task surfaces as
# a PytestUnraisableExceptionWarning (pytest wraps the RuntimeWarning), which a
# CLI `-W error::RuntimeWarning` alone does NOT catch — the two must both be
# errors. Kept narrow: only these two categories, so unrelated third-party
# DeprecationWarnings do not turn the suite red.
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::RuntimeWarning",
]
markers = [
    "postgres: requires FONELY_TEST_DATABASE_URL and PostgreSQL",
    "live: requires live provider credentials (Sarvam/Cartesia/Anthropic) and PostgreSQL",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
