services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fonely
      POSTGRES_USER: fonely
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - fonely_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fonely", "-d", "fonely"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:?Set WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:?Set WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:?Set WHATSAPP_APP_SECRET}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  inbound-worker:
    build:
      context: backend
    command: [".venv/bin/python", "run_inbound_worker.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SARVAM_API_KEY: ${SARVAM_API_KEY:?Set SARVAM_API_KEY}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  notification-worker:
    build:
      context: backend
    command: [".venv/bin/python", "run_worker.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:?Set WHATSAPP_ACCESS_TOKEN}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  retention-worker:
    build:
      context: backend
    command: [".venv/bin/python", "run_retention_worker.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RETENTION_CONVERSATIONS_DAYS: ${RETENTION_CONVERSATIONS_DAYS:-90}
      RETENTION_APPOINTMENTS_DAYS: ${RETENTION_APPOINTMENTS_DAYS:-365}
      RETENTION_CALL_TRANSCRIPTS_DAYS: ${RETENTION_CALL_TRANSCRIPTS_DAYS:-90}
      RETENTION_NOTIFICATIONS_DAYS: ${RETENTION_NOTIFICATIONS_DAYS:-30}
      RETENTION_NOTIFICATIONS_DEAD_LETTER_DAYS: ${RETENTION_NOTIFICATIONS_DEAD_LETTER_DAYS:-90}
      RETENTION_WHATSAPP_INBOUND_DAYS: ${RETENTION_WHATSAPP_INBOUND_DAYS:-30}
      RETENTION_WHATSAPP_INBOUND_DEAD_LETTER_DAYS: ${RETENTION_WHATSAPP_INBOUND_DEAD_LETTER_DAYS:-30}
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  fonely_pgdata:
