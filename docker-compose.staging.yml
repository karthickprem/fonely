services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fonely
      POSTGRES_USER: fonely
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - fonely_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fonely", "-d", "fonely"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  inbound-worker:
    build:
      context: backend
    command: [".venv/bin/python", "run_inbound_worker.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  fonely_pgdata:
